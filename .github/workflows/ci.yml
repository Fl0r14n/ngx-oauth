name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # build:lib first — the sample app imports ngx-oauth through the tsconfig path that points at
      # dist/ngx-oauth, so it cannot compile until ng-packagr has emitted the library
      - run: bun run build:lib
      # ngx-oauth's test target is @angular/build:unit-test (vitest, headless), so no browser is needed;
      # the sample app's karma target would need one, and nothing here invokes it
      - run: bun run test
      - run: bun run build:app
